name: Gemini model health

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".pr_agent.toml"
      - "scripts/check-pr-agent-models.mjs"
      - "scripts/check-pr-agent-models.test.mjs"
      - ".github/workflows/gemini-model-health.yml"
  push:
    branches: [main]
    paths:
      - ".pr_agent.toml"
      - "scripts/check-pr-agent-models.mjs"
      - "scripts/check-pr-agent-models.test.mjs"
      - ".github/workflows/gemini-model-health.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test the model checker
        run: node --test scripts/check-pr-agent-models.test.mjs
      - name: Check configured Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REQUIRE_LIVE: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: node scripts/check-pr-agent-models.mjs
