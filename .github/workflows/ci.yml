name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: npm test + client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w client

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run Playwright
        run: npm run test:e2e
        env:
          CI: true
          JWT_SECRET: ci-jwt-secret-which-is-long-enough
          EMAIL_PEPPER: ci-email-pepper-long-enough
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
